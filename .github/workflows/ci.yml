name: CI

# Runs the package checks on every push and pull request:
# lint, coding standard, PHPStan against PrestaShop 8 and 9, PHP compatibility,
# conventions (docblocks) and unit tests.
on:
  push:
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: PrestaShop sources for PHPStan (official images)
        run: |
          for version in $(php -r 'echo implode(" ", json_decode(file_get_contents("tests/phpstan/config.json"), true)["versions"]);'); do
            id=$(docker create "prestashop/prestashop:$version")
            mkdir -p "/tmp/prestashop/$version"
            docker cp "$id:/var/www/html/." "/tmp/prestashop/$version"
            docker rm "$id" > /dev/null
          done

      - name: Checks
        env:
          PS_CACHE_DIR: /tmp/prestashop
        run: |
          composer install --no-interaction --no-progress
          composer check
